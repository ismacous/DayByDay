name: DayByDay Android APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    # Sans limite, un serveur qui se bloque garde le job six heures (le defaut
    # de GitHub) et l'APK n'arrive jamais. C'est deja arrive : une compilation
    # de deux minutes est restee accrochee plus d'une heure. Mieux vaut un
    # echec rapide, qu'un nouveau push relance.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests
        timeout-minutes: 15
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        timeout-minutes: 15
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/DayByDay.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: DayByDay-apk
          path: artifacts/DayByDay.apk
          if-no-files-found: error

  instrumented:
    name: Emulator tests
    runs-on: ubuntu-latest
    # Deux tentatives d'emulateur, dix minutes de demarrage chacune au pire :
    # au-dela d'une heure, plus rien ne se passe.
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # La compilation se fait **avant** d'allumer l'emulateur, et c'est le
      # coeur du probleme qui rendait ces tests inutilisables. Lancee depuis le
      # script de l'emulateur, elle compilait Kotlin et KSP pendant qu'une
      # machine virtuelle Android de plusieurs gigaoctets tournait a cote : le
      # noyau tuait l'emulateur au pic, sans rien ecrire dans le journal. On
      # voyait seulement l'appareil disparaitre en plein test
      # (« device 'emulator-5554' not found »), et la seance s'arretait la,
      # vingt tests avant la fin. Compile d'abord, l'emulateur ne fait plus
      # qu'installer et jouer.
      - name: Compiler avant d'allumer l'emulateur
        timeout-minutes: 20
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      # Le demarrage de l'emulateur echoue souvent sur les machines de GitHub :
      # adb ne voit jamais l'appareil apparaitre ("Timeout waiting for emulator
      # to boot") et le job echoue sans avoir lance un seul test. Passer de
      # l'image ATD a google_apis a aide sans regler le probleme, alors on
      # reessaie une fois : deux demarrages rates d'affilee sont rares. Une
      # tentative qui echoue apres le demarrage, elle, echoue aussi la seconde
      # fois, donc un vrai test casse reste visible.
      #
      # Les deux etapes doivent rester identiques : seul le nom change.
      - name: Run tests on an Android emulator
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disk-size: 6G
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -no-snapshot -noaudio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none -camera-front none
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Run tests on an Android emulator (seconde tentative)
        if: steps.emulator.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disk-size: 6G
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -no-snapshot -noaudio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none -camera-front none
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DayByDay-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
